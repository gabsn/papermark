# Builds the self-hosted Papermark image (selfhost/Dockerfile) and pushes it to
# ghcr.io/gabsn/papermark (:main and :<commit>), public, for the deck VM to pull without auth.
name: deck-vm-image

on:
  push:
    branches: [main]
    paths:
      - "selfhost/**"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - ".github/workflows/deck-vm-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deck-vm-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Native arm64 runner: no QEMU emulation for the Next.js build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: selfhost/Dockerfile
          platforms: linux/arm64
          push: true
          # :main only from main; a dispatch on another branch pushes only its commit.
          tags: |
            ghcr.io/gabsn/papermark:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/gabsn/papermark:main' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://deck.focustree.app
            NEXT_PUBLIC_MARKETING_URL=https://deck.focustree.app
            NEXT_PUBLIC_APP_BASE_HOST=deck.focustree.app
            NEXT_PUBLIC_UPLOAD_TRANSPORT=s3
            NEXT_PUBLIC_WEBHOOK_BASE_HOST=webhooks.invalid
            NEXT_PUBLIC_WEBHOOK_BASE_URL=https://webhooks.invalid
            NEXT_PUBLIC_SIGNING_HOST=https://sign.trait.so
            NEXT_PUBLIC_SIGNING_TEAM_URL=personal_koyhffdfsztdzorx
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # GitHub's API cannot change a package's visibility: it is set once by hand (Package
      # settings > Danger Zone > Change visibility > Public). Fail until anyone can pull it.
      - name: Image is public
        run: |
          token=$(curl -sS "https://ghcr.io/token?scope=repository:gabsn/papermark:pull" | jq -r '.token // empty')
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/gabsn/papermark/manifests/${{ github.sha }}"; then
            echo "::error::ghcr.io/gabsn/papermark is not public: https://github.com/users/gabsn/packages/container/papermark/settings > Danger Zone > Change visibility > Public"
            exit 1
          fi
